name: deploy

# Manual-dispatch only. The previous `workflow_run` trigger auto-deployed
# every successful CI run on main, which makes large refactors and feature
# merges high-risk. Now you click "Run workflow" with confirm_deploy=yes
# and target_sha defaulting to the latest main HEAD.
on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "yes" to confirm. Anything else aborts.'
        required: true
        default: 'no'
        type: string
      target_sha:
        description: 'Commit SHA to deploy. Default = current main HEAD.'
        required: false
        default: ''
        type: string

# Prevent two deploys racing each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  HEALTH_URL: https://sahovat.tech/api/health

jobs:
  guard:
    name: confirmation guard
    runs-on: ubuntu-latest
    steps:
      - name: verify confirm_deploy input
        run: |
          if [ "${{ inputs.confirm_deploy }}" != "yes" ]; then
            echo "::error::confirm_deploy must be 'yes' (got '${{ inputs.confirm_deploy }}')"
            exit 1
          fi
          echo "confirm_deploy=yes — proceeding"

  deploy:
    name: deploy to production
    runs-on: ubuntu-latest
    needs: guard
    steps:
      # ----------------------------------------------------------------
      # 1. Pre-deploy: capture rollback target, pull new code, take
      #    snapshot, tag :previous, write in-progress state file.
      #
      # IMPORTANT ordering:
      #   a. Capture ROLLBACK_SHA from PRIOR successful deploy's state
      #      (or git HEAD if no state yet) BEFORE we git-reset.
      #   b. Capture image-id of running containers and tag :previous
      #      BEFORE we build (so we always have a recoverable image).
      #   c. ONLY THEN `git reset --hard $TARGET_SHA` — needed so that
      #      `scripts/pre-deploy-snapshot.sh` (added in this PR) is on
      #      disk before we try to run it.
      #   d. Take snapshot.
      #   e. Write `.last-deploy-state.in-progress` (NOT the final
      #      state file — that's promoted only by post-deploy success).
      # ----------------------------------------------------------------
      - name: pre-deploy — capture state, pull code, snapshot, tag images
        id: pre_deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            # --- a. Disk-space gate ---
            FREE_KB=$(df --output=avail -k / | tail -1)
            FREE_GB=$((FREE_KB / 1024 / 1024))
            echo "free disk: ${FREE_GB} GB"
            if [ "$FREE_GB" -lt 2 ]; then
              echo "::error::insufficient disk space (${FREE_GB} GB < 2 GB required)"
              exit 1
            fi

            # --- b. Determine ROLLBACK_SHA from prior successful deploy ---
            # Priority:
            #   1. .last-deploy-state (written by previous SUCCESSFUL deploy
            #      — DEPLOY_TARGET_SHA is what's currently running).
            #   2. git rev-parse HEAD as fallback for first deploy on the
            #      new pipeline.
            if [ -f .last-deploy-state ]; then
              PRIOR_TARGET=$(grep '^DEPLOY_TARGET_SHA=' .last-deploy-state | cut -d= -f2 || true)
              if [ -n "$PRIOR_TARGET" ]; then
                ROLLBACK_SHA="$PRIOR_TARGET"
                echo "rollback target SHA from prior state: $ROLLBACK_SHA"
              else
                ROLLBACK_SHA=$(git rev-parse HEAD)
                echo "rollback target SHA from git HEAD (state malformed): $ROLLBACK_SHA"
              fi
            else
              ROLLBACK_SHA=$(git rev-parse HEAD)
              echo "rollback target SHA from git HEAD (no prior state): $ROLLBACK_SHA"
            fi

            # --- c. Tag currently-running images :previous ---
            # Done BEFORE git pull so on-disk code drift doesn't matter.
            for svc in backend frontend; do
              if docker image inspect sahovat-${svc}:latest >/dev/null 2>&1; then
                docker tag sahovat-${svc}:latest sahovat-${svc}:previous
                echo "tagged sahovat-${svc}:previous from :latest"
              else
                CID=$(docker ps -q --filter "name=sahovat_${svc}")
                if [ -n "$CID" ]; then
                  IMG_ID=$(docker inspect --format '{{.Image}}' "$CID")
                  docker tag "$IMG_ID" sahovat-${svc}:previous
                  echo "tagged sahovat-${svc}:previous from running container ${CID:0:12}"
                else
                  echo "::warning::no running sahovat_${svc} container; rollback for this service will be limited"
                fi
              fi
            done

            # --- d. NOW pull new code so scripts/ are on disk ---
            TARGET_SHA="${{ inputs.target_sha }}"
            if [ -z "$TARGET_SHA" ]; then
              TARGET_SHA="${{ github.sha }}"
            fi
            echo "target SHA: $TARGET_SHA"
            git fetch origin
            git reset --hard "$TARGET_SHA"

            # --- e. Take pre-deploy snapshot ---
            if [ ! -x scripts/pre-deploy-snapshot.sh ]; then
              echo "::error::scripts/pre-deploy-snapshot.sh missing or not executable after git reset"
              exit 1
            fi
            SNAPSHOT_FILE=$(bash scripts/pre-deploy-snapshot.sh)
            echo "snapshot: $SNAPSHOT_FILE"

            # --- f. Write IN-PROGRESS state file (promoted to final on success) ---
            cat > .last-deploy-state.in-progress <<EOF
            ROLLBACK_SHA=$ROLLBACK_SHA
            SNAPSHOT_FILE=$SNAPSHOT_FILE
            DEPLOY_TIMESTAMP=$(date -Iseconds)
            DEPLOY_TARGET_SHA=$TARGET_SHA
            EOF
            echo "in-progress state file written:"
            cat .last-deploy-state.in-progress

      # ----------------------------------------------------------------
      # 2. Deploy: build, up, migrate. Health-gated.
      #    Pre-deploy already pulled the code; this step only builds.
      # ----------------------------------------------------------------
      - name: deploy — build, up, migrate
        id: deploy
        if: steps.pre_deploy.outcome == 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            # Build with build args read from .env.production for the frontend
            # NEXT_PUBLIC_* values that need to be inlined at build time.
            docker compose --env-file .env.production -f docker-compose.prod.yml build --no-cache

            # Bring everything up. Backend healthcheck is defined in compose.
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d

            # Wait for backend to become healthy in-container before migrating.
            # 90s budget — covers cold start + zod validation + DB connection.
            echo "waiting for backend container health..."
            for i in $(seq 1 18); do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' sahovat_backend 2>/dev/null || echo "missing")
              echo "  attempt $i/18: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                break
              fi
              if [ "$STATUS" = "missing" ]; then
                if ! docker ps --format '{{.Names}}' | grep -qx sahovat_backend; then
                  echo "::error::sahovat_backend container is not running"
                  docker compose -f docker-compose.prod.yml logs --tail 100 backend
                  exit 1
                fi
              fi
              sleep 5
            done
            FINAL_STATUS=$(docker inspect --format '{{.State.Health.Status}}' sahovat_backend)
            if [ "$FINAL_STATUS" != "healthy" ]; then
              echo "::error::backend not healthy after 90s (status=$FINAL_STATUS)"
              docker compose -f docker-compose.prod.yml logs --tail 100 backend
              exit 1
            fi

            # Migrations. Run inside the running backend container.
            echo "running migrations..."
            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend node dist/database/migrate.js

            docker image prune -f
            echo "deploy step finished cleanly"

      # ----------------------------------------------------------------
      # 3. Public health check via the trip-wire URL.
      # ----------------------------------------------------------------
      - name: verify — public health check
        id: health
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            HEALTH_URL=${{ env.HEALTH_URL }} bash scripts/health-check.sh \
              --max-attempts 6 --interval-seconds 10

      # ----------------------------------------------------------------
      # 4. Rollback if pre-deploy, deploy, or health-check failed.
      #
      # IMPORTANT: only roll back if pre-deploy got far enough to write
      # the in-progress state file. If pre-deploy failed before that
      # (disk gate, image tagging issues, git pull failure, etc.),
      # production is unchanged and there's nothing to roll back to —
      # we just report and exit.
      # ----------------------------------------------------------------
      - name: rollback — on any pre-deploy / deploy / health failure
        if: steps.pre_deploy.outcome != 'success' || steps.deploy.outcome != 'success' || steps.health.outcome != 'success'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            if [ ! -f .last-deploy-state.in-progress ]; then
              echo "::warning::pre-deploy never wrote .last-deploy-state.in-progress"
              echo "production state is unchanged — nothing to roll back"
              echo "containers, database, and prior :previous tags untouched"
              exit 0
            fi

            echo "::warning::deploy failed — invoking rollback"
            cat .last-deploy-state.in-progress
            bash scripts/rollback.sh --yes

            # Clean up the in-progress marker so a future manual rollback
            # via scripts/rollback.sh doesn't try to act on it again.
            rm -f .last-deploy-state.in-progress

      - name: fail workflow if rollback occurred
        if: steps.pre_deploy.outcome != 'success' || steps.deploy.outcome != 'success' || steps.health.outcome != 'success'
        run: |
          echo "::error::deploy failed. See preceding log for rollback details."
          echo "  pre_deploy: ${{ steps.pre_deploy.outcome }}"
          echo "  deploy:     ${{ steps.deploy.outcome }}"
          echo "  health:     ${{ steps.health.outcome }}"
          exit 1

      # ----------------------------------------------------------------
      # 5. Success bookkeeping: promote in-progress state, dated tag,
      #    retention prune.
      # ----------------------------------------------------------------
      - name: post-deploy — promote state, tag dated rollback point, prune
        if: steps.pre_deploy.outcome == 'success' && steps.deploy.outcome == 'success' && steps.health.outcome == 'success'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            # Promote in-progress → final. Next deploy reads this for
            # ROLLBACK_SHA.
            mv .last-deploy-state.in-progress .last-deploy-state
            echo "state promoted to .last-deploy-state"

            DATED_TAG="rollback-$(date +%Y%m%d-%H%M)"
            docker tag sahovat-backend:latest  sahovat-backend:${DATED_TAG}
            docker tag sahovat-frontend:latest sahovat-frontend:${DATED_TAG}
            echo "tagged: sahovat-{backend,frontend}:${DATED_TAG}"

            # Retain the 3 most recent dated rollback tags per service.
            for svc in backend frontend; do
              docker images "sahovat-${svc}" --format '{{.Tag}}' \
                | grep -E '^rollback-[0-9]{8}-[0-9]{4}$' \
                | sort -r \
                | tail -n +4 \
                | while read -r OLD_TAG; do
                    echo "pruning sahovat-${svc}:${OLD_TAG}"
                    docker rmi "sahovat-${svc}:${OLD_TAG}" || true
                  done
            done

            # Echo deploy summary for the workflow log.
            echo "----- deploy summary -----"
            cat .last-deploy-state
            echo "--------------------------"

            echo "deploy successful — rollback target preserved as :previous and ${DATED_TAG}"
