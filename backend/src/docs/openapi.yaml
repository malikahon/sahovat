      summary: Request donation OTP
      description: Request OTP for high-value donation verification (>100k UZS)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaign_id, amount]
              properties:
                campaign_id:
                  type: string
                  format: uuid
                amount:
                  type: integer
                  minimum: 100001
      responses:
        '200':
          description: OTP sent

