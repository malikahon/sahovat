    post:
      tags: [Donations]
      summary: Verify donation OTP
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                donation_id:
                  type: string
                  format: uuid
                otp:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: OTP verified

  /api/donations/initiate:
    post:
      tags: [Donations]
      summary: Initiate donation
      description: Start a donation. Returns a checkout URL (PayMe redirect) or processes via saved card.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaign_id, amount, payment_provider]
              properties:
                campaign_id:
                  type: string
                  format: uuid
                amount:
                  type: integer
                  minimum: 1000
                  maximum: 10000000000
                  description: Amount in UZS (min 1000)
                fee_included:
                  type: boolean
                  default: false
                payment_provider:
                  $ref: '#/components/schemas/PaymentProvider'
                is_anonymous:
                  type: boolean
                  default: false
                donor_display_name:
                  type: string
                  maxLength: 100
                note:
                  type: string
                  maxLength: 500
                saved_card_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Donation initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      donation:
                        $ref: '#/components/schemas/Donation'
                      checkout_url:
                        type: string
                        description: Redirect URL for PayMe payment

