  # ═══════════════════════════════════════════
  # SAVED CARDS
  # ═══════════════════════════════════════════
  /api/saved-cards:
    post:
      tags: [Saved Cards]
      summary: Add card
      description: Initiate card tokenization via PayMe Subscribe API. Triggers OTP to card's phone number.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card_number, card_expire]
              properties:
                card_number:
                  type: string
                  pattern: '^\d{16}$'
                card_expire:
                  type: string
                  pattern: '^\d{4}$'
                  description: Expiry in MMYY format
      responses:
        '201':
          description: Card created, OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      card_id:
                        type: string
                        format: uuid
                      message:
                        type: string
    get:
      tags: [Saved Cards]
      summary: List saved cards
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of verified saved cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavedCard'

  /api/saved-cards/verify:
    post:
      tags: [Saved Cards]
      summary: Verify card OTP
      description: Complete card save by verifying OTP
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card_id, code]
              properties:
                card_id:
                  type: string
                  format: uuid
                code:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: Card verified and saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SavedCard'

  /api/saved-cards/{id}:
    delete:
      tags: [Saved Cards]
      summary: Remove card
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Card removed

  /api/saved-cards/{id}/default:
    put:
      tags: [Saved Cards]
      summary: Set default card
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Card set as default

  # ═══════════════════════════════════════════
  # PAYME MERCHANT API
  # ═══════════════════════════════════════════
  /api/payme:
    post:
      tags: [PayMe]
      summary: PayMe Merchant API
      description: |
        JSON-RPC 2.0 endpoint for PayMe Merchant API.
        Handles: CheckPerformTransaction, CreateTransaction, PerformTransaction,
        CancelTransaction, CheckTransaction, GetStatement.
        Uses HTTP Basic auth with PayMe merchant credentials.
      security:
        - PaymeBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, params]
              properties:
                id:
                  type: integer
                method:
                  type: string
                  enum: [CheckPerformTransaction, CreateTransaction, PerformTransaction, CancelTransaction, CheckTransaction, GetStatement]
                params:
                  type: object
      responses:
        '200':
          description: JSON-RPC response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  result:
                    type: object
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: object

