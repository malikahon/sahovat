openapi: 3.1.0
info:
  title: Sahovat API
  version: 1.0.0
  description: |
    Crowdfunding platform for Uzbekistan. REST API powering campaign creation,
    donations via PayMe, withdrawal management, admin operations, and personalized feeds.

    ## Authentication
    Most endpoints require a Bearer JWT token in the `Authorization` header.
    Tokens are obtained via the OTP login flow (`/api/auth/request-otp` → `/api/auth/verify-otp`).

    Access tokens expire in 15 minutes. Use `/api/auth/refresh` to obtain new tokens.

    Admin endpoints (`/api/admin/*`) require both authentication and admin role.

    ## Currency
    All monetary amounts are in UZS (Uzbekistani som), stored as integers (no tiyin).

    ## Pagination
    Paginated endpoints accept `page` (default 1) and `limit` (default 20, max 100).
    Responses include a `pagination` object with `page`, `limit`, `total`, and `totalPages` (or `total_pages`).
  contact:
    name: Sahovat Team
  license:
    name: MIT

servers:
  - url: http://localhost:3001
    description: Local development
  - url: https://sahovat.tech
    description: Production

tags:
  - name: Health
    description: Health check
  - name: Auth
    description: Authentication — OTP login, registration, admin login, token management
  - name: Users
    description: User profile management, OneID verification, KYC documents
  - name: Campaigns
    description: Campaign CRUD, documents, cover images, listing
  - name: Donations
    description: Donation flow, PayMe integration, receipts, ledger
  - name: Withdrawals
    description: Withdrawal requests and organizer dashboard
  - name: Withdrawal Accounts
    description: Bank/card account management for organizers
  - name: Events
    description: Behavioral event tracking for feed personalization
  - name: Feed
    description: Personalized campaign feed
  - name: Recurring Donations
    description: Recurring donation subscriptions and impact stats
  - name: Saved Cards
    description: PayMe card tokenization and management
  - name: PayMe
    description: PayMe Merchant API webhook (JSON-RPC 2.0)
  - name: Admin
    description: Admin panel — dashboard, user/campaign management, withdrawals, settings, audit

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    PaymeBasicAuth:
      type: http
      scheme: basic
      description: PayMe Merchant API Basic auth

  schemas:
    # ── Enums ──
    CampaignCategory:
      type: string
      enum: [medical, education, emergency, community, creative, business, other]
    CampaignStatus:
      type: string
      enum: [draft, pending_review, active, paused, completed, cancelled, frozen]
    DonationStatus:
      type: string
      enum: [pending, completed, failed, refunded]
    WithdrawalStatus:
      type: string
      enum: [pending, approved, rejected, completed]
    PaymentProvider:
      type: string
      enum: [payme, click, uzum]
    WithdrawalProvider:
      type: string
      enum: [payme, uzcard, humo]
    DocumentType:
      type: string
      enum: [medical_report, id_document, proof_of_residence, financial_statement, photo, other]
    VerificationStatus:
      type: string
      enum: [none, pending, approved, rejected]
    EventType:
      type: string
      enum: [campaign_viewed, campaign_shared, donation_initiated, donation_completed]
    UzbekRegion:
      type: string
      enum: [tashkent, tashkent_region, samarkand, bukhara, fergana, andijan, namangan, kashkadarya, surkhandarya, khorezm, navoi, jizzakh, syrdarya, karakalpakstan]
    RecurringFrequency:
      type: string
      enum: [weekly, monthly]
    RecurringStatus:
      type: string
      enum: [active, paused, cancelled, failed]

    # ── Generic Wrappers ──
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          {}
        message:
          type: string
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        code:
          type: string
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    # ── Entities ──
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone_number:
          type: string
          example: "+998901234567"
        display_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum: [male, female]
          nullable: true
        preferred_categories:
          type: array
          items:
            $ref: '#/components/schemas/CampaignCategory'
        is_verified:
          type: boolean
        is_admin:
          type: boolean
        is_banned:
          type: boolean
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        language_preference:
          type: string
          enum: [uz, ru, en]
        bio:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Campaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
        creator_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/CampaignCategory'
        goal_amount:
          type: integer
          description: Goal in UZS
        current_amount:
          type: integer
          description: Total raised in UZS
        status:
          $ref: '#/components/schemas/CampaignStatus'
        region:
          $ref: '#/components/schemas/UzbekRegion'
          nullable: true
        is_verified:
          type: boolean
        end_date:
          type: string
          format: date
          nullable: true
        cover_image_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CampaignWithStats:
      allOf:
        - $ref: '#/components/schemas/Campaign'
        - type: object
          properties:
            donor_count:
              type: integer
            progress_percentage:
              type: number
            creator_display_name:
              type: string
              nullable: true
            days_remaining:
              type: integer
              nullable: true
            score:
              type: number
              description: Feed relevance score (only in feed responses)

    CampaignDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        document_type:
          $ref: '#/components/schemas/DocumentType'
        file_url:
          type: string
        file_name:
          type: string
        file_size:
          type: integer
        mime_type:
          type: string
        is_private:
          type: boolean
        notes:
          type: string
          nullable: true
        uploaded_at:
          type: string
          format: date-time

    Donation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        donor_id:
          type: string
          format: uuid
        amount:
          type: integer
          description: Gross amount in UZS
        platform_fee:
          type: integer
        net_amount:
          type: integer
        payment_provider:
          $ref: '#/components/schemas/PaymentProvider'
        payment_transaction_id:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/DonationStatus'
        is_anonymous:
          type: boolean
        donor_display_name:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    DonationWithCampaign:
      allOf:
        - $ref: '#/components/schemas/Donation'
        - type: object
          properties:
            campaign_title:
              type: string
            campaign_cover_image_url:
              type: string
              nullable: true

    WithdrawalAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        provider:
          $ref: '#/components/schemas/WithdrawalProvider'
        account_number_masked:
          type: string
          example: "8600 **** **** 1234"
        account_holder_name:
          type: string
        is_primary:
          type: boolean
        is_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Withdrawal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        organizer_id:
          type: string
          format: uuid
        withdrawal_account_id:
          type: string
          format: uuid
        amount:
          type: integer
        platform_fee:
          type: integer
        net_amount:
          type: integer
        status:
          $ref: '#/components/schemas/WithdrawalStatus'
        card_number_masked:
          type: string
        cardholder_name:
          type: string
        admin_notes:
          type: string
          nullable: true
        transaction_reference:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true

    RecurringDonation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        donor_id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
          nullable: true
        category:
          $ref: '#/components/schemas/CampaignCategory'
          nullable: true
        amount:
          type: integer
        frequency:
          $ref: '#/components/schemas/RecurringFrequency'
        payment_provider:
          $ref: '#/components/schemas/PaymentProvider'
        status:
          $ref: '#/components/schemas/RecurringStatus'
        next_charge_date:
          type: string
          format: date
        last_charge_date:
          type: string
          format: date
          nullable: true
        failure_count:
          type: integer
        campaign_title:
          type: string
          nullable: true
        campaign_cover_image_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SavedCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        card_number_masked:
          type: string
          example: "860006******1234"
        card_expire:
          type: string
          example: "0828"
        card_type:
          type: string
          enum: [uzcard, humo, unknown]
        is_default:
          type: boolean
        is_verified:
          type: boolean
        created_at:
          type: string
          format: date-time

    CampaignBalance:
      type: object
      properties:
        campaign_id:
          type: string
          format: uuid
        total_donated:
          type: integer
        total_withdrawn:
          type: integer
        total_fees:
          type: integer
        available_balance:
          type: integer
        pending_withdrawals:
          type: integer

    ImpactStats:
      type: object
      properties:
        total_donated:
          type: integer
        campaigns_supported:
          type: integer
        streak_weeks:
          type: integer
        total_donations_count:
          type: integer
        recurring_active_count:
          type: integer
        recurring_total_monthly:
          type: integer

    AdminDashboardStats:
      type: object
      properties:
        total_users:
          type: integer
        total_campaigns:
          type: integer
        active_campaigns:
          type: integer
        total_donations_amount:
          type: integer
        total_donations_count:
          type: integer
        total_withdrawals_amount:
          type: integer
        pending_withdrawals_count:
          type: integer
        pending_campaigns_count:
          type: integer
        total_platform_fees:
          type: integer
        total_escrow_balance:
          type: integer

    AdminSettings:
      type: object
      properties:
        id:
          type: string
          format: uuid
        master_card_number_masked:
          type: string
          nullable: true
        master_card_holder_name:
          type: string
        platform_fee_percentage:
          type: number
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
        updater_display_name:
          type: string
          nullable: true

    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

paths:
  # ═══════════════════════════════════════════
  # HEALTH
  # ═══════════════════════════════════════════
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      description: Verifies database and Redis connectivity
      responses:
        '200':
          description: All services healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  timestamp:
                    type: string
                    format: date-time
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                      redis:
                        type: string

  # ═══════════════════════════════════════════
  # AUTH
  # ═══════════════════════════════════════════
  /api/auth/request-otp:
    post:
      tags: [Auth]
      summary: Request OTP
      description: Send a 6-digit OTP code to the given phone number via SMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number]
              properties:
                phone_number:
                  type: string
                  pattern: '^\+998\d{9}$'
                  example: "+998901234567"
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify OTP
      description: Verify OTP code and receive JWT tokens. Returns is_new_user=true if user needs to complete registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number, otp]
              properties:
                phone_number:
                  type: string
                  pattern: '^\+998\d{9}$'
                otp:
                  type: string
                  minLength: 6
                  maxLength: 6
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: OTP verified, tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      tokens:
                        $ref: '#/components/schemas/AuthTokens'
                      is_new_user:
                        type: boolean
        '401':
          description: Invalid or expired OTP

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Complete registration
      description: Complete profile after first OTP verification. Requires auth token or registration_token.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name:
                  type: string
                  minLength: 2
                  maxLength: 100
                date_of_birth:
                  type: string
                  format: date
                gender:
                  type: string
                  enum: [male, female]
                preferred_categories:
                  type: array
                  items:
                    $ref: '#/components/schemas/CampaignCategory'
                  maxItems: 7
                language_preference:
                  type: string
                  enum: [uz, ru, en]
                registration_token:
                  type: string
      responses:
        '200':
          description: Registration complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      tokens:
                        $ref: '#/components/schemas/AuthTokens'

  /api/auth/set-password:
    post:
      tags: [Auth]
      summary: Set password
      description: Set password for campaign creators (enables admin-style login)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password set
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /api/auth/admin/login:
    post:
      tags: [Auth]
      summary: Admin login
      description: Login with phone number and password (admin users only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number, password]
              properties:
                phone_number:
                  type: string
                  pattern: '^\+998\d{9}$'
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Admin authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      tokens:
                        $ref: '#/components/schemas/AuthTokens'

  /api/auth/admin/verify-password:
    post:
      tags: [Auth]
      summary: Verify admin password
      description: Verify admin password after OTP-based login for elevated access
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      tokens:
                        $ref: '#/components/schemas/AuthTokens'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh tokens
      description: Exchange a refresh token for a new access/refresh token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AuthTokens'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Revoke refresh token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      description: Get authenticated user info from token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'

  # ═══════════════════════════════════════════
  # USERS
  # ═══════════════════════════════════════════
  /api/users/profile:
    get:
      tags: [Users]
      summary: Get profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
    put:
      tags: [Users]
      summary: Update profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  minLength: 2
                  maxLength: 100
                date_of_birth:
                  type: string
                  format: date
                gender:
                  type: string
                  enum: [male, female]
                preferred_categories:
                  type: array
                  items:
                    $ref: '#/components/schemas/CampaignCategory'
                  maxItems: 7
                language_preference:
                  type: string
                  enum: [uz, ru, en]
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'

  /api/users/oneid/initiate:
    get:
      tags: [Users]
      summary: Initiate OneID verification
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OneID redirect URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      redirect_url:
                        type: string

  /api/users/oneid/callback:
    get:
      tags: [Users]
      summary: OneID callback
      description: OAuth callback from OneID (public, redirects to frontend)
      parameters:
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
      responses:
        '302':
          description: Redirect to frontend

  /api/users/verification/document:
    post:
      tags: [Users]
      summary: Upload KYC document
      description: Upload a verification document (passport, ID) to private storage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string

  /api/users/verification/documents:
    get:
      tags: [Users]
      summary: List verification documents
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of user's verification documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        document_type:
                          type: string
                        status:
                          type: string
                        uploaded_at:
                          type: string
                          format: date-time

  # ═══════════════════════════════════════════
  # CAMPAIGNS
  # ═══════════════════════════════════════════
  /api/campaigns:
    get:
      tags: [Campaigns]
      summary: List campaigns
      description: Browse campaigns with filters, search, and sorting. Public endpoint (auth optional).
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: category
          schema: { $ref: '#/components/schemas/CampaignCategory' }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/CampaignStatus' }
        - in: query
          name: region
          schema: { $ref: '#/components/schemas/UzbekRegion' }
        - in: query
          name: search
          schema: { type: string, maxLength: 200 }
        - in: query
          name: sort_by
          schema: { type: string, enum: [created_at, goal_amount, current_amount, end_date, urgency], default: created_at }
        - in: query
          name: sort_order
          schema: { type: string, enum: [asc, desc], default: desc }
        - in: query
          name: creator_id
